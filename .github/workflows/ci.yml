name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Maven Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit, WebMvc & H2 integration tests
        run: ./mvnw -B clean verify

      - name: Package application JAR
        run: ./mvnw -B package -DskipTests

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: dyfi-jar
          path: target/dyfiwildlifecentre-1.0.jar

  playwright-e2e:
    name: Playwright Browser E2E Tests
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dyfi_wildlife_centre
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: dyfi-jar
          path: target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start application and run E2E suite
        env:
          DB_URL: jdbc:postgresql://localhost:5432/dyfi_wildlife_centre
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_password
          APP_BOOTSTRAP_TRANSPORT: "true"
          APP_BOOTSTRAP_ADMIN_PASSWORD: ci_admin_password
          E2E_ADMIN_USERNAME: dyfi_admin
          E2E_ADMIN_PASSWORD: ci_admin_password
        working-directory: e2e
        run: npx playwright test

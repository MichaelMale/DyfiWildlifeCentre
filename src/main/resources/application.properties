spring.thymeleaf.cache=false
spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties

## Spring DATASOURCE (override via environment variables or local gitignored config)
spring.sql.init.mode=never
spring.sql.init.platform=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dyfi_wildlife_centre}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.continue-on-error=true

# SQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway database migrations (baselines existing DB cleanly at v1)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Schema stays managed cleanly alongside Flyway
spring.jpa.hibernate.ddl-auto=update

# POI Image Uploads, Transport Bootstrap & Monitoring
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.bootstrap.transport-on-empty=${APP_BOOTSTRAP_TRANSPORT:true}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
springdoc.swagger-ui.path=/swagger-ui.html

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head><title></title></head>
<body>

<div class="modal dyfi-modal" id="webcamModal" th:fragment="webcamModal"
     th:data-error-stream="#{webcams.streamError}">
    <div class="modal-content">
        <h5 style="display:flex; align-items:center; gap:8px; margin-top:0;">
            <i class="material-icons teal-text text-darken-3" aria-hidden="true">videocam</i>
            <span th:text="#{webcams.title}">Dyfi Osprey Webcam</span>
        </h5>
        <p class="grey-text text-darken-1" th:text="#{webcams.subtitle}">
            Watch the live osprey nest camera stream below.
        </p>

        <div id="webcamButtons" style="margin-bottom: 12px;"></div>

        <h6 id="webcamFeedTitle" style="font-weight: 600; margin-bottom: 4px;"></h6>
        <p id="webcamFeedDescription" class="grey-text text-darken-2" style="margin-top: 0;"></p>

        <div id="webcamStreamError" class="dyfi-alert dyfi-alert--error" style="display:none;"></div>

        <div id="webcamYoutubeContainer"
             style="display:none; position:relative; width:100%; padding-bottom:56.25%; height:0; background:#000; border-radius:8px; overflow:hidden;">
            <iframe id="webcamYoutubePlayer"
                    title="Dyfi Osprey Webcam"
                    src=""
                    style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
            </iframe>
        </div>

        <video id="webcamVideoPlayer" controls playsinline loop preload="metadata"
               poster="images/osprey.jpeg"
               style="width:100%; max-height:420px; background:#000; border-radius:8px;">
        </video>
    </div>
    <div class="modal-footer">
        <a id="webcamExternalLink" href="https://www.youtube.com/watch?v=YnKZJ3SF5WM"
           target="_blank" rel="noopener noreferrer"
           class="waves-effect waves-light btn-flat" style="display:none;"
           th:text="#{webcams.watchOnYoutube}">Watch on YouTube</a>
        <a href="#!" class="modal-close waves-effect waves-light btn-flat" th:text="#{webcams.close}">Close</a>
    </div>
</div>

</body>
</html>
